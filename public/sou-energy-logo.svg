<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Lâmina orgânica SOU Energy: formato curvado suave tipo castanha, com pontas e bordas arredondadas -->
    <path id="souOrganicPetal" d="
      M 59.4 -8.4
      C 83.5 -33.7, 114.2 -50.8, 142.8 -30.4
      C 157.4 13.8, 145.0 67.6, 105.0 101.4
      C 75.5 111.9, 47.5 82.3, 49.5 55.0
      C 52.6 32.9, 56.7 12.1, 59.4 -8.4 Z
    " />
  </defs>

  <!-- Fundo Laranja Oficial 100% Quadrado (Cantos Retos como no arquivo enviado) -->
  <rect width="512" height="512" fill="#FF5500" />

  <!-- 6 Pétalas Brancas Centralizadas -->
  <g transform="translate(256, 256) scale(1.05)">
    <use href="#souOrganicPetal" fill="#FFFFFF" transform="rotate(-120)" />
    <use href="#souOrganicPetal" fill="#FFFFFF" transform="rotate(-60)" />
    <use href="#souOrganicPetal" fill="#FFFFFF" transform="rotate(0)" />
    <use href="#souOrganicPetal" fill="#FFFFFF" transform="rotate(60)" />
    <use href="#souOrganicPetal" fill="#FFFFFF" transform="rotate(120)" />
    <use href="#souOrganicPetal" fill="#FFFFFF" transform="rotate(180)" />
  </g>
</svg>
